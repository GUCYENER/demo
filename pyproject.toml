# VYRA — ruff lint/format yapılandırması (vyrazeus.md KAP 1 lint gate)
# Bootstrap: v3.72.x — `pip install ruff` ile kuruldu.
[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "python",            # embedded CPython runtime
    "Lib",
    "node_modules",
    "frontend/dist",
    "Gecici_Dosyalar_Sil",
    ".agents",
    "alembic",
]

[tool.ruff.lint]
# Başlangıç kümesi: pyflakes (F) + pycodestyle error (E) + isort (I).
# Adoption sonrası genişletilebilir (B, UP, SIM ...).
select = ["E", "F", "I"]
ignore = [
    "E501",  # line-too-long — format ayrı ele alır
    "E402",  # module-import-not-at-top — kasıtlı (sys.path setup / conditional import)
    "E701",  # multiple-statements (colon) — stil; ruff format ele alır
    "E702",  # multiple-statements (semicolon) — stil
    "E712",  # == True/False — ilk adoption'da stil; sonra sıkılaştır (F-series öncelik)
    "E741",  # ambiguous-variable-name (l/I/O) — yaygın, rename churn/shadow riski
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # paket re-export (public API) — kasıtlı "unused" import
